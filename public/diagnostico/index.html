<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mi Carta de Rumbo | MEG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{--bg:#10141f;--panel:#171d2c;--panel2:#1f2740;--line:rgba(201,162,39,.2);--gold:#c9a227;--gold2:#e4c766;--text:#ede7da;--muted:#9ba4b9;--red:#e1574a;--yellow:#f0b429;--green:#3fa34d}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(0deg,rgba(201,162,39,.035) 0,rgba(201,162,39,.035) 1px,transparent 1px,transparent 64px),var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh}.wrap{max-width:1040px;margin:auto;padding:28px 22px 70px}.top{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.compass{width:40px;height:40px;flex:none}h1{font:700 clamp(26px,5vw,42px) 'Space Grotesk',sans-serif;margin:0}.sub{font:500 11px 'IBM Plex Mono',monospace;color:var(--gold2);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 0}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin:18px 0}.tab{background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:9px 13px;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer}.tab.active{color:var(--gold2);border-bottom-color:var(--gold)}.tab small{display:block;font:9px 'IBM Plex Mono',monospace;margin-top:2px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.chip,.area,.route{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}.chip span,.meta-label,.field span,.stage-name{display:block;font:500 10px 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.chip strong{display:block;font:700 20px 'Space Grotesk',sans-serif;margin-top:5px}.dot{display:inline-block!important;width:10px;height:10px;border-radius:50%;margin-right:7px}.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}.dot.green{background:var(--green)}.dot.grey{background:#46506a}.meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}.meta>div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}.area{margin:11px 0}.area-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.area h2{font:600 16px 'Space Grotesk',sans-serif;margin:0 0 4px}.question{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.score{font:600 12px 'IBM Plex Mono',monospace;padding:6px 10px;border-radius:7px}.score.red{background:#4c2528;color:#ff9187}.score.yellow{background:#4b3b17;color:#ffd873}.score.green{background:#183c29;color:#91e5a0}.score.grey{background:#252c3d;color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-top:11px}.field{background:var(--panel2);border:1px solid #3a4661;border-radius:8px;padding:10px}.field strong{display:block;font-size:13px;margin-top:4px}.field .previous{color:var(--muted);font-weight:500}.calcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:9px;margin-top:11px}.calc{background:rgba(63,163,77,.08);border:1px solid rgba(63,163,77,.6);border-radius:8px;padding:11px}.calc h3{font:600 10px 'IBM Plex Mono',monospace;text-transform:uppercase;color:#8fe39c;margin:0 0 6px}.calc-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0}.calc-row strong{color:#8fe39c;font-family:'IBM Plex Mono',monospace}.calc-row.total{border-top:1px solid #3fa34d66;margin-top:3px;padding-top:7px}.route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px}.route.highlight{grid-column:1/-1;border-color:var(--gold)}.route h2{font-size:15px;margin:0 0 12px}.route-values{display:flex;justify-content:space-between;align-items:center;gap:8px}.route-values div{text-align:center}.route-values span{display:block;font:9px 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.empty{padding:32px;text-align:center;border:1px dashed var(--line);border-radius:11px;color:var(--muted)}@media(max-width:620px){.wrap{padding:20px 13px 50px}.area-head,.route-values{flex-direction:column}.route-values div{text-align:left}.tab{flex:1}.route.highlight{grid-column:auto}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top"><svg class="compass" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#C9A227" stroke-width="1.4"/><circle cx="20" cy="20" r="2" fill="#E4C766"/><path d="M20 4 L23 20 L20 24 L17 20 Z" fill="#C9A227"/><path d="M20 36 L18 24 L20 22 L22 24 Z" fill="#3A415A"/></svg><div><h1 id="title">Carta de Rumbo</h1><p id="subtitle" class="sub">Cargando tu diagnóstico...</p></div></header>
      <div id="app"></div>
    </main>
    <script src="/diagnostico/diagnostico-core.js?v=20260820-1"></script>
    <script>
      (()=>{
        const core=window.DiagnosticCore,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const badge=n=>{const b=core.band(n);return `<span class="score ${b}">${n==null?'Sin datos':`${n}/5 · ${core.bandLabel(b)}`}</span>`};
        const valueAt=(data,stage,item,field,type)=>{const area=data.checkpoints[stage].areas[item.key];const raw=type==='select'?area.selects[field.key]:area.nums[field.key];return type==='select'?(raw||'—'):(core.formatField(field.key,raw)||'—')};
        function fieldsHtml(data,stage,item){const current=data.checkpoints[stage].areas[item.key];const all=[...item.numFields.map(f=>({field:f,type:'number'})),...item.selectFields.map(f=>({field:f,type:'select'}))];return `<div class="fields">${all.map(({field,type})=>{const value=valueAt(data,stage,item,field,type);const previous=item.compareStage?valueAt(data,item.compareStage,item,field,type):null;return `<div class="field"><span>${esc(field.label)}${field.derivedFrom?' · automática':''}</span>${previous?`<strong class="previous">${esc(previous)} →</strong>`:''}<strong>${esc(value)}</strong></div>`}).join('')}</div>`}
        function calcsHtml(checkpoint,areaKey){const x=core.calculateStage(checkpoint);if(areaKey==='resultados')return `<div class="calcs"><div class="calc"><h3>Margen de contribución neto</h3><div class="calc-row"><span>Costo financiero efectivo</span><strong>${core.formatPercent(x.financialCost)}</strong></div><div class="calc-row"><span>Impuesto variable efectivo</span><strong>${core.formatPercent(x.taxCost)}</strong></div><div class="calc-row total"><span>Margen neto</span><strong>${core.formatPercent(x.netMargin)}</strong></div></div><div class="calc"><h3>Rentabilidad calculada</h3><div class="calc-row"><span>Ventas</span><strong>${core.formatMoney(x.sales)}</strong></div><div class="calc-row"><span>Costos variables</span><strong>${core.formatMoney(x.variableCosts)}</strong></div><div class="calc-row"><span>Contribución marginal</span><strong>${core.formatMoney(x.contribution)}</strong></div><div class="calc-row"><span>Costos fijos</span><strong>${core.formatMoney(x.fixedCosts)}</strong></div><div class="calc-row total"><span>Resultado del mes</span><strong>${core.formatMoney(x.monthlyResult)}</strong></div><div class="calc-row"><span>Rentabilidad neta</span><strong>${core.formatPercent(x.netProfitPercent)}</strong></div><div class="calc-row"><span>Punto de equilibrio</span><strong>${core.formatMoney(x.breakEven)}</strong></div></div></div>`;if(areaKey==='finanzas')return `<div class="calcs"><div class="calc"><h3>Resultado financiero a 30 días</h3><div class="calc-row"><span>Solo proveedores</span><strong>${core.formatMoney(x.finance?.providersResult)}</strong></div><div class="calc-row total"><span>Todas las deudas</span><strong>${core.formatMoney(x.finance?.totalResult)}</strong></div></div><div class="calc"><h3>Cashflow proyectado</h3><div class="calc-row"><span>Ingresos</span><strong>${core.formatMoney(x.finance?.projectedIncome)}</strong></div><div class="calc-row"><span>Egresos</span><strong>${core.formatMoney(x.finance?.projectedExpense)}</strong></div><div class="calc-row total"><span>Resultado proyectado</span><strong>${core.formatMoney(x.finance?.projectedResult)}</strong></div></div></div>`;return ''}
        function stageHtml(data,stage){const cp=data.checkpoints[stage],summary=core.computeSummary(cp,stage);return `<section><div class="summary"><div class="chip"><span>Promedio automático</span><strong><i class="dot ${summary.band}"></i>${summary.average==null?'—':summary.average.toFixed(1)}</strong></div><div class="chip"><span>Estado general</span><strong><i class="dot ${summary.band}"></i>${core.bandLabel(summary.band)}</strong></div></div><div class="meta"><div><span class="meta-label">Checkpoint</span><strong>${esc(cp.date||'Aún sin fecha')}</strong></div>${cp.csm?`<div><span class="meta-label">CSM</span><strong>${esc(cp.csm)}</strong></div>`:''}</div>${core.STAGE_ITEMS[stage].map(item=>{const area=cp.areas[item.key];return `<article class="area"><div class="area-head"><div><h2>${esc(item.label)}</h2><p class="question">${esc(item.question)}</p></div>${badge(area.score)}</div>${fieldsHtml(data,stage,item)}${calcsHtml(cp,item.key)}</article>`}).join('')}</section>`}
        const metrics=[{key:'margenContribucion',label:'Margen de Contribución',area:'resultados',highlight:true},{key:'margenMarcacion',label:'Margen de Marcación',area:'resultados'},{key:'facturacionPromedio',label:'Facturación promedio',area:'resultados'},{key:'costosFijos',label:'Costos fijos',area:'resultados'},{key:'margenContribucionProducto',label:'Margen del producto más vendido',area:'costos'}];
        function routeHtml(data){const metricCards=metrics.map(m=>{const values=core.STAGES.map(s=>core.formatField(m.key,data.checkpoints[s].areas[m.area].nums[m.key])||'—');if(values.every(v=>v==='—'))return'';return `<article class="route ${m.highlight?'highlight':''}"><h2>${esc(m.label)}</h2><div class="route-values">${core.STAGES.map((s,i)=>`<div><span>${s}</span><strong>${esc(values[i])}</strong></div>${i<2?'<b>→</b>':''}`).join('')}</div></article>`}).filter(Boolean).join('');const scores=['costos','resultados','finanzas'].map(k=>{const label=core.STAGE_ITEMS.inicial.find(i=>i.key===k).label;return `<article class="route"><h2>${esc(label)}</h2><div class="route-values">${core.STAGES.map((s,i)=>`<div><span>${s}</span>${badge(data.checkpoints[s].areas[k].score)}</div>${i<2?'<b>→</b>':''}`).join('')}</div></article>`}).join('');return `<div class="route-grid">${metricCards||'<div class="empty">Todavía no hay indicadores para comparar.</div>'}${scores}</div>`}
        async function main(){const ghlId=new URLSearchParams(location.search).get('ghl_id'),app=$('#app');if(!ghlId){app.innerHTML='<div class="empty">El link de diagnóstico no es válido.</div>';return}try{const response=await fetch(`/api/diagnostico/cliente/${encodeURIComponent(ghlId)}`,{headers:{Accept:'application/json'},cache:'no-store'}),payload=await response.json().catch(()=>({}));if(!response.ok||!payload.ok)throw Error(payload.message||'No pude obtener el diagnóstico.');const diagnostic=payload.diagnostico,data=core.normalizeData(diagnostic.data,diagnostic.csmName);$('#title').textContent=`Carta de Rumbo de ${diagnostic.clientName}`;$('#subtitle').textContent=[diagnostic.businessName,diagnostic.csmName?`Acompañado por ${diagnostic.csmName}`:''].filter(Boolean).join(' · ')||'Tu recorrido durante el programa.';let active='inicial';const render=()=>{app.innerHTML=`<nav class="tabs">${[...core.STAGES,'rumbo'].map(s=>`<button class="tab ${active===s?'active':''}" data-tab="${s}">${s==='rumbo'?'Carta de Rumbo':s[0].toUpperCase()+s.slice(1)}<small>${s==='inicial'?'Antes de empezar':s==='medio'?'Unidades 2, 3 y 4':s==='final'?'Unidades 6 y 7':'Comparativo'}</small></button>`).join('')}</nav>${active==='rumbo'?routeHtml(data):stageHtml(data,active)}`;app.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{active=button.dataset.tab;render()})};render()}catch(error){app.innerHTML=`<div class="empty">${esc(error.message||'No pude abrir este diagnóstico.')}</div>`}}main();
      })();
    </script>
  </body>
</html>
