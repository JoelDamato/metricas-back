<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi diagnóstico | MEG</title><style>
:root{--bg:#10141f;--panel:#171d2c;--line:#34405c;--text:#ede7da;--muted:#aeb6c7;--gold:#e4c766;--red:#ff9187;--yellow:#ffd873;--green:#91e5a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#25385c 0,transparent 32rem),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1040px;margin:auto;padding:32px 20px 60px}.brand{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:800}.top{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px}h1{font-size:clamp(27px,5vw,44px);margin:8px 0}.sub,.q{color:var(--muted);line-height:1.5}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#19233a;color:var(--text);border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.tab.active{background:var(--gold);color:#20180a;border-color:var(--gold)}.stage{display:none}.stage.active{display:block}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}.meta div,.area{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:15px}.meta span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.area{margin:11px 0}.area h2{margin:0 0 5px;font-size:18px}.score{display:inline-block;padding:5px 9px;border-radius:7px;font-weight:800;margin:8px 0}.score.red{background:#552a34;color:var(--red)}.score.yellow{background:#574721;color:var(--yellow)}.score.green{background:#24563f;color:var(--green)}.score.none{background:#273146;color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:11px}.field{background:#1f2740;border:1px solid #3a4661;border-radius:8px;padding:10px}.field span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
</style></head><body><main class="wrap"><header class="top"><div class="brand">Método Acelerador de Ganancias</div><h1 id="title">Carta de rumbo</h1><p id="subtitle" class="sub">Cargando tu diagnóstico...</p></header><div id="app"></div></main><script>
const labels={margenMarcacion:'Margen de marcación',margenContribucion:'Margen de contribución bruto',productoMasVendido:'Producto/servicio más vendido',margenMarcacionProducto:'Margen de marcación del producto',margenContribucionProducto:'Margen de contribución del producto',costosFinancieros:'Costos financieros',impuestosVariables:'Impuestos variables',trasladoFinanciero:'Traslado de costo financiero',trasladoImpositivo:'Traslado de impuestos variables',facturacionPromedio:'Facturación promedio mensual',costosFijos:'Costos fijos totales',resultadoUltimoMes:'Resultado último mes',comparaProyecta:'Comparación y proyección',dineroDisponible:'Dinero disponible',porCobrar:'Por cobrar a 30 días',deudaProveedores:'Deuda a proveedores',otrasDeudas:'Otras deudas',fondoEmergencia:'Fondo de emergencia',fondoInversiones:'Fondo de inversiones',ventas:'Ventas / facturación de referencia'};
const areaNames={costos:'Costos y Precios',resultados:'Estado de Resultados',analisis:'Análisis y Planificación',finanzas:'Finanzas y Cash Flow',rentabilidadFinal:'Resumen de Rentabilidad',finanzas_u6:'Finanzas y Cash Flow · Unidad 6',finanzas_u7:'Finanzas y Cash Flow · Unidad 7'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(n){return n?`<div class="score ${n<=2?'red':n===3?'yellow':'green'}">${n}/5 · ${n<=2?'Crítico':n===3?'En desarrollo':'Avanzado'}</div>`:'<div class="score none">Sin puntaje cargado</div>'}function stageHtml(key,cp){const areas=cp?.areas||{};return `<section class="stage" data-stage="${key}"><div class="meta"><div><span>Checkpoint</span><strong>${esc(cp?.date||'Aún sin fecha')}</strong></div></div>${Object.entries(areas).map(([k,a])=>`<article class="area"><h2>${esc(areaNames[k]||k)}</h2>${score(a.score)}<div class="fields">${Object.entries(a.values||{}).filter(([,v])=>v).map(([f,v])=>`<div class="field"><span>${esc(labels[f]||f)}</span><strong>${esc(v)}</strong></div>`).join('')||'<span class="q">Todavía no hay datos cargados en esta sección.</span>'}</div></article>`).join('')}</section>`}
async function main(){const ghlId=new URLSearchParams(location.search).get('ghl_id'),app=document.querySelector('#app');if(!ghlId){app.innerHTML='<div class="empty">El link de diagnóstico no es válido.</div>';return}try{const r=await fetch('/api/diagnostico/cliente/'+encodeURIComponent(ghlId),{headers:{Accept:'application/json'},cache:'no-store'}),isJson=(r.headers.get('content-type')||'').includes('application/json'),x=isJson?await r.json():null;if(!r.ok||!x?.ok)throw Error(x?.message||'No pude obtener el diagnóstico. Volvé a abrir el enlace.');const d=x.diagnostico;document.querySelector('#title').textContent=`Carta de rumbo de ${d.clientName}`;document.querySelector('#subtitle').textContent=[d.businessName,d.csmName?`Acompañado por ${d.csmName}`:''].filter(Boolean).join(' · ')||'Tu recorrido y evolución durante el programa.';const cps=d.data?.checkpoints||{},stages=['inicial','medio','final'];app.innerHTML=`<nav class="tabs">${stages.map((s,i)=>`<button class="tab ${i?'':'active'}" data-tab="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</nav>${stages.map(s=>stageHtml(s,cps[s])).join('')}`;app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{app.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));app.querySelectorAll('.stage').forEach(x=>x.classList.toggle('active',x.dataset.stage===b.dataset.tab))});app.querySelector('.stage')?.classList.add('active')}catch(e){app.innerHTML=`<div class="empty">${esc(e.message||'No pude abrir este diagnóstico.')}</div>`}}main();
</script></body></html>
