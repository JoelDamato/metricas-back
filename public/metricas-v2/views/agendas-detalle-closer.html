<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendas por Closer | Métricas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css?v=20261009-release-1" />
    <link rel="stylesheet" href="/css/agendas-closer.css?v=20261019-loading-1" />
  </head>
  <body class="ranking-page agenda-page agenda-modern premium-navy-background">
    <main class="container">
      <div class="nav"><a href="/metricas.html">Volver al listado</a></div>
      <section class="agenda-hero">
        <span class="agenda-eyebrow">RENDIMIENTO COMERCIAL</span>
        <h1>Agendas por Closer</h1>
        <p>Tus agendas, conversiones e ingresos. Una lectura mensual de todo el recorrido comercial.</p>
      </section>

      <div class="actions ranking-actions">
        <label>
          Año
          <select id="anio"></select>
        </label>
        <label>
          Origen
          <select id="origen"></select>
        </label>
        <label>
          Closer
          <select id="closer"></select>
        </label>
        <button id="reload">Aplicar filtros</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <div id="agendaLoading" class="agenda-loading" hidden aria-hidden="true">
        <div class="agenda-loading-heading"><span class="agenda-spinner"></span><div><strong>Preparando tus métricas</strong><p>Estamos consultando las agendas y actualizando los resultados.</p></div></div>
        <div class="agenda-loading-cards"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="agenda-loading-table"><span></span><span></span><span></span><span></span></div>
      </div>
      <section id="kpiContainer" class="cards"></section>
      <section id="tableContainer"></section>

    </main>

    <script src="/js/api/http.js?v=20260804-1"></script>
    <script src="/js/api/metricas.api.js?v=20260513-1"></script>
    <script src="/js/auth-shell.js?v=20261009-release-1"></script>
    <script src="/js/views/agendas-closer.page.js?v=20261019-loading-1"></script>
  </body>
</html>
