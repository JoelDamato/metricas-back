<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte Mensual Final de Closers</title>
  <link rel="icon" type="image/svg+xml" href="/metricas-assets/favicon-mr.svg">
  <style id="monthlyReportStyles">
    :root{--bg:#07101d;--bg2:#0a1525;--card:#101e33;--card2:#162741;--line:#263958;--text:#eff5ff;--muted:#9caccc;--green:#3ddc97;--red:#ff7474;--gold:#f5c451;--blue:#69a7ff;--violet:#b29aff;--shadow:0 20px 55px rgba(0,0,0,.3)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(105,167,255,.15),transparent 26%),radial-gradient(circle at 5% 10%,rgba(61,220,151,.07),transparent 24%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif}.page{width:min(1380px,calc(100vw - 32px));margin:0 auto;padding:104px 0 56px}.embedded .page{width:min(1380px,calc(100vw - 16px));padding:16px 0 40px}.hero,.panel,.closer-card,.table-wrap,.empty-state{background:linear-gradient(180deg,rgba(18,32,54,.97),rgba(11,22,38,.97));border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:28px;padding:28px;overflow:hidden}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(2rem,4vw,3.25rem);line-height:1.03;margin:9px 0 8px}.hero p,.section-head p{color:var(--muted);line-height:1.55;margin:0}.report-controls{min-width:min(100%,360px);display:grid;gap:10px}.report-controls label{display:grid;gap:6px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.report-controls input{height:44px;border:1px solid var(--line);border-radius:13px;background:rgba(7,16,29,.72);color:var(--text);padding:0 13px;font:inherit}.action-row{display:flex;gap:8px;flex-wrap:wrap}.btn{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--card2);color:var(--text);padding:0 14px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.btn.primary{color:#fff5cf;border-color:rgba(245,196,81,.36);background:rgba(245,196,81,.16)}.summary-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:22px}.stat{padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(7,16,29,.55)}.stat span,.callout span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.stat strong,.callout strong{display:block;margin-top:7px;font-size:1.28rem}.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.section-head h2{font-size:1.16rem;margin:0 0 4px}.section-head p{font-size:13px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border-radius:22px;padding:18px}.exec-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}.exec-list li{display:flex;gap:10px;padding:11px 12px;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:rgba(255,255,255,.025);font-size:13px;line-height:1.5;color:#dce7fb}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(61,220,151,.55);margin-top:6px;flex:0 0 auto}.dot.gold{background:var(--gold);box-shadow:0 0 14px rgba(245,196,81,.55)}.chips,.closer-counts{display:flex;gap:7px;flex-wrap:wrap}.chip,.result-tag,.auto-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;border:1px solid transparent;font-size:10px;font-weight:800;line-height:1.2}.chip.check,.auto-badge{color:var(--green);background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.25)}.chip.strike{color:var(--red);background:rgba(255,116,116,.12);border-color:rgba(255,116,116,.25)}.chip.pending{color:var(--violet);background:rgba(178,154,255,.12);border-color:rgba(178,154,255,.25)}.chip.bonus{color:var(--gold);background:rgba(245,196,81,.14);border-color:rgba(245,196,81,.28)}.chip.neutral{color:var(--blue);background:rgba(105,167,255,.12);border-color:rgba(105,167,255,.25)}.closers-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.closer-card{border-radius:20px;padding:16px}.closer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.closer-top h3{font-size:1rem;margin:7px 0 0}.rank-badge{display:inline-flex;align-items:center;justify-content:center;min-width:33px;border-radius:999px;padding:4px 8px;color:var(--gold);background:rgba(245,196,81,.13);border:1px solid rgba(245,196,81,.24);font-size:10px;font-weight:800}.score-pill{min-width:58px;text-align:center;border-radius:999px;padding:8px 10px;font-weight:800}.score-pill.positive{color:var(--green);background:rgba(61,220,151,.13)}.score-pill.negative{color:var(--red);background:rgba(255,116,116,.13)}.score-pill.neutral{color:var(--blue);background:rgba(105,167,255,.13)}.closer-counts{margin-top:13px}.reason-block{border-top:1px solid rgba(255,255,255,.08);padding-top:11px;margin-top:11px}.reason-block h4{margin:0 0 7px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.reason-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}.reason-list li{display:flex;justify-content:space-between;gap:8px;color:#dce6f8;font-size:12px;line-height:1.45}.reason-list.empty{color:var(--muted)}.result-box{margin-top:13px;border-radius:12px;padding:10px;font-size:11px;font-weight:800;line-height:1.4}.result-box.reward,.result-tag.reward{color:var(--green);background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.24)}.result-box.neutral,.result-tag.neutral{color:var(--muted);background:rgba(156,172,204,.1);border-color:rgba(156,172,204,.2)}.result-box.consequence,.result-tag.consequence,.result-box.severe,.result-tag.severe{color:#ffadad;background:rgba(255,116,116,.12);border-color:rgba(255,116,116,.25)}.table-wrap{overflow:auto;border-radius:18px}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px;vertical-align:top}th{color:var(--muted);background:rgba(255,255,255,.035);font-size:9px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}tr:last-child td{border-bottom:none}.right{text-align:right}.positive-text{color:var(--green)}.negative-text{color:var(--red)}.bonus-text{color:var(--gold)}.muted,.footnote{color:var(--muted)}.bar-list{display:grid;gap:11px}.bar-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}.bar-head span{color:var(--muted)}.bar-track{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}.bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--blue))}.bonus-callouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.callout{border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.025);padding:11px}.callout.gold{border-color:rgba(245,196,81,.25);background:rgba(245,196,81,.08)}.callout strong{font-size:1rem}.footnote{font-size:11px;line-height:1.5;margin:10px 0 0}.empty-state{border-radius:22px;text-align:center;padding:36px 20px}.empty-state h2{margin:0 0 8px}.empty-state p{color:var(--muted);margin:0;line-height:1.6}#monthlyReportStatus{width:min(1380px,calc(100vw - 32px));margin:0 auto;color:var(--muted);font-size:12px;padding:0 0 8px}.embedded #monthlyReportStatus{width:min(1380px,calc(100vw - 16px))}@media(max-width:1100px){.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.closers-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}@media(max-width:680px){.page{width:calc(100vw - 14px);padding:88px 0 32px}.embedded .page{width:calc(100vw - 10px);padding-top:8px}.hero{padding:18px;border-radius:20px}.summary-grid,.closers-grid,.bonus-callouts{grid-template-columns:1fr}.report-controls{min-width:100%}h1{font-size:1.9rem}.panel{padding:14px}th,td{padding:10px 9px}}
    @media print{body{background:#07101d!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.page{width:100%;padding:0}.section{break-inside:avoid}.closer-card{break-inside:avoid}.hero,.panel,.closer-card,.table-wrap{box-shadow:none}}
  </style>
</head>
<body>
  <div id="monthlyReportStatus">Preparando reporte mensual…</div>
  <main id="monthlyReportRoot" class="page" aria-live="polite"></main>
  <script src="/js/api/http.js"></script>
  <script src="/js/api/metricas.api.js"></script>
  <script src="/js/auth-shell.js"></script>
  <script src="/js/agenda-monthly-report.js"></script>
  <script src="/js/views/agenda-monthly-report.page.js"></script>
</body>
</html>
