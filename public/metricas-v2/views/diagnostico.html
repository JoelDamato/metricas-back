<!doctype html>
<html lang="es">

    <title>Carta de Rumbo | Métricas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />

    <style>
      :root{--diag-bg:#10141f;--diag-panel:#171d2c;--diag-panel-2:#1f2740;--diag-line:rgba(201,162,39,.2);--diag-grid:rgba(201,162,39,.035);--diag-gold:#c9a227;--diag-gold-soft:#e4c766;--diag-paper:#ede7da;--diag-muted:#9ba4b9;--diag-red:#e1574a;--diag-yellow:#f0b429;--diag-green:#3fa34d;--diag-link-bg:#111725;--diag-link-text:#f2db86;--diag-shadow:0 15px 38px #0003;--diag-score-red-bg:#4c2528;--diag-score-red-text:#ff9187;--diag-score-yellow-bg:#4b3b17;--diag-score-yellow-text:#ffd873;--diag-score-green-bg:#183c29;--diag-score-green-text:#91e5a0;--diag-score-grey-bg:#252c3d;--diag-score-grey-line:#566079;--diag-derived:#8fe39c}
      :root[data-diagnostic-theme='light']{--diag-bg:#f7f3e9;--diag-panel:#fffdf7;--diag-panel-2:#f1ecdf;--diag-line:rgba(122,91,12,.24);--diag-grid:rgba(122,91,12,.055);--diag-gold:#9a7410;--diag-gold-soft:#755707;--diag-paper:#252116;--diag-muted:#706957;--diag-red:#b63f35;--diag-yellow:#a86d00;--diag-green:#257738;--diag-link-bg:#f4ecd3;--diag-link-text:#664b05;--diag-shadow:0 15px 38px rgba(72,56,20,.12);--diag-score-red-bg:#fbe4e1;--diag-score-red-text:#9e3028;--diag-score-yellow-bg:#fff0c8;--diag-score-yellow-text:#7b5200;--diag-score-green-bg:#dff2e2;--diag-score-green-text:#1f6b31;--diag-score-grey-bg:#ece8df;--diag-score-grey-line:#aaa18e;--diag-derived:#24783a}
      *{box-sizing:border-box}.diag-page{margin:0;background:repeating-linear-gradient(0deg,var(--diag-grid) 0,var(--diag-grid) 1px,transparent 1px,transparent 64px),var(--diag-bg);color:var(--diag-paper);font-family:Inter,sans-serif;min-height:100vh;transition:background-color .2s ease,color .2s ease}.diag{max-width:1180px;margin:auto;padding:28px 24px 80px}.diag-top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--diag-line);padding-bottom:18px;margin-bottom:18px}.diag-top-actions{display:grid;justify-items:end;gap:9px}.diag-title{display:flex;align-items:center;gap:13px}.diag-compass{width:38px;height:38px}.back{color:var(--diag-gold-soft);font:600 12px 'IBM Plex Mono',monospace;text-decoration:none}.diag h1{font:700 clamp(24px,4vw,36px) 'Space Grotesk',sans-serif;margin:6px 0 2px}.diag-sub{color:var(--diag-muted);font:500 11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin:0}.diagnostic-theme-switch{display:inline-flex;gap:3px;padding:4px;background:var(--diag-panel);border:1px solid var(--diag-line);border-radius:10px;box-shadow:var(--diag-shadow)}.diagnostic-theme-switch button{border:0;border-radius:7px;background:transparent;color:var(--diag-muted);padding:7px 10px;font:600 11px 'IBM Plex Mono',monospace;cursor:pointer}.diagnostic-theme-switch button.active{background:var(--diag-gold);color:#fff}.panel{background:var(--diag-panel);border:1px solid var(--diag-line);border-radius:12px;padding:17px 18px;margin:13px 0;box-shadow:var(--diag-shadow)}.client-form,.actions,.tabs,.summary-strip,.meta-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.field{display:grid;gap:5px;flex:1 1 195px}.field>span,.field>label,.diag-label{font:500 10px 'IBM Plex Mono',monospace;color:var(--diag-muted);text-transform:uppercase;letter-spacing:.05em}.diag input,.diag select,.diag textarea{width:100%;background:var(--diag-panel-2);border:1px solid var(--diag-line);color:var(--diag-paper);border-radius:7px;padding:9px 10px;font:13px Inter,sans-serif}.diag input:focus,.diag select:focus,.diag textarea:focus{outline:2px solid var(--diag-gold);outline-offset:1px}.diag textarea{min-height:65px;resize:vertical}.btn{border:0;border-radius:7px;background:var(--diag-gold);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:var(--diag-gold-soft);border:1px solid var(--diag-gold)}.btn.danger{background:transparent;color:var(--diag-red);border:1px solid var(--diag-red)}.btn:disabled{opacity:.45}.muted{color:var(--diag-muted);margin:5px 0;line-height:1.5}.small{font:500 10px 'IBM Plex Mono',monospace;color:var(--diag-muted);text-transform:uppercase}.status{font:12px 'IBM Plex Mono',monospace;color:var(--diag-muted)}.status.ok{color:var(--diag-derived)}.status.error{color:var(--diag-red)}.client-suggestions{display:grid;gap:5px;margin-top:6px}.client-suggestions button,.client-row button{border:1px solid var(--diag-line);background:var(--diag-panel-2);color:var(--diag-paper);border-radius:7px;padding:9px 10px;text-align:left;cursor:pointer}.client-suggestions small{display:block;color:var(--diag-muted);margin-top:2px}.client-list{display:grid;gap:6px;margin-top:11px}.client-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.client-row button{flex:1}.link-box{font:12px 'IBM Plex Mono',monospace;word-break:break-all;color:var(--diag-link-text);background:var(--diag-link-bg);border:1px dashed var(--diag-gold);padding:10px;border-radius:8px}.tabs{align-items:stretch;border-bottom:1px solid var(--diag-line);padding-bottom:10px}.tab{background:transparent;color:var(--diag-muted);border:0;border-bottom:2px solid transparent;border-radius:0}.tab.active{color:var(--diag-gold-soft);border-bottom-color:var(--diag-gold)}.tab small{display:block;font:9px 'IBM Plex Mono',monospace;margin-top:2px}.summary-chip{flex:1;min-width:160px;background:var(--diag-panel);border:1px solid var(--diag-line);border-radius:10px;padding:12px 14px}.summary-chip .label{font:10px 'IBM Plex Mono',monospace;color:var(--diag-muted);text-transform:uppercase}.summary-chip .value{font:700 20px 'Space Grotesk',sans-serif;margin-top:4px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.dot.red{background:var(--diag-red)}.dot.yellow{background:var(--diag-yellow)}.dot.green{background:var(--diag-green)}.dot.grey{background:#777}.meta-row{margin:16px 0}.meta-row .field{max-width:290px}.area{background:var(--diag-panel);border:1px solid var(--diag-line);border-radius:11px;padding:17px 18px;margin:12px 0}.area-head{display:grid;grid-template-columns:1fr auto;gap:18px}.area h3{font:600 15px 'Space Grotesk',sans-serif;margin:0 0 4px}.question{font-size:12.5px;line-height:1.5;color:var(--diag-muted);margin:0 0 10px}.score-badge{font:600 12px 'IBM Plex Mono',monospace;padding:6px 10px;border-radius:7px;white-space:nowrap}.score-badge.red{background:var(--diag-score-red-bg);color:var(--diag-score-red-text);border:1px solid var(--diag-red)}.score-badge.yellow{background:var(--diag-score-yellow-bg);color:var(--diag-score-yellow-text);border:1px solid var(--diag-yellow)}.score-badge.green{background:var(--diag-score-green-bg);color:var(--diag-score-green-text);border:1px solid var(--diag-green)}.score-badge.grey{background:var(--diag-score-grey-bg);color:var(--diag-muted);border:1px dashed var(--diag-score-grey-line)}.input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}.compare-grid{display:grid;gap:6px;margin-top:10px}.compare-row{display:grid;grid-template-columns:minmax(190px,1fr) minmax(120px,.55fr) 24px minmax(170px,.75fr);gap:8px;align-items:center;padding-top:7px;border-top:1px solid var(--diag-line)}.compare-label{font-size:12px}.previous{font:12px 'IBM Plex Mono',monospace;color:var(--diag-muted);text-align:right}.arrow{text-align:center;color:var(--diag-muted)}.derived input{color:var(--diag-derived);border-style:dashed}.calcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;margin-top:12px}.calc-block{background:color-mix(in srgb,var(--diag-green) 8%,transparent);border:1px solid color-mix(in srgb,var(--diag-green) 65%,transparent);border-radius:9px;padding:11px 13px}.calc-title{font:600 10px 'IBM Plex Mono',monospace;color:var(--diag-derived);text-transform:uppercase;margin:0 0 7px}.calc-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0}.calc-row strong{font-family:'IBM Plex Mono',monospace;color:var(--diag-derived)}.calc-row.total{border-top:1px solid color-mix(in srgb,var(--diag-green) 40%,transparent);margin-top:3px;padding-top:7px}.patterns{background:var(--diag-panel);border:1px solid var(--diag-line);border-radius:10px;padding:14px 16px;margin-top:12px}.patterns-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.pattern-chip{display:flex;gap:6px;align-items:center;background:var(--diag-panel-2);border:1px solid var(--diag-line);border-radius:20px;padding:7px 11px;font-size:12px;cursor:pointer}.pattern-chip.checked{background:color-mix(in srgb,var(--diag-gold) 18%,transparent);border-color:var(--diag-gold);color:var(--diag-gold-soft)}.pattern-chip input{width:auto}.save-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--diag-line);padding-top:14px;margin-top:15px}.route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.route-card{background:var(--diag-panel);border:1px solid var(--diag-line);border-radius:10px;padding:15px}.route-card.highlight{grid-column:1/-1;border-color:var(--diag-gold)}.route-values{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}.route-value span{display:block;font:9px 'IBM Plex Mono',monospace;color:var(--diag-muted);text-transform:uppercase;margin-bottom:5px}.route-value strong{font:700 17px 'Space Grotesk',sans-serif}.route-score{margin-top:13px}.empty{padding:28px;text-align:center;color:var(--diag-muted);border:1px dashed var(--diag-line);border-radius:10px}.stage-label{font:10px 'IBM Plex Mono',monospace;color:var(--diag-muted);text-transform:uppercase}.admin-only{display:block}
      @media(max-width:720px){.diag{padding:17px 13px 60px}.area-head{grid-template-columns:1fr}.compare-row{grid-template-columns:1fr}.previous,.arrow{text-align:left}.btn{width:100%}.actions .btn{width:auto}.save-bar{align-items:stretch;flex-direction:column}.route-values{align-items:flex-start;flex-direction:column;text-align:left}}
    </style>
  </head>
  <body class="diag-page">
    <main class="diag">
      <header class="diag-top">
        <div>
          <a class="back" href="/index.html">← Volver al panel CSM</a>
          <div class="diag-title">
            <svg class="diag-compass" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#C9A227" stroke-width="1.4"/><circle cx="20" cy="20" r="2" fill="#E4C766"/><path d="M20 4 L23 20 L20 24 L17 20 Z" fill="#C9A227"/><path d="M20 36 L18 24 L20 22 L22 24 Z" fill="#3A415A"/></svg>
            <div><h1>Carta de Rumbo del Cliente</h1><p class="diag-sub">Diagnóstico Inicial → Medio → Final</p></div>
          </div>
        </div>
        <div class="diag-top-actions">
          <div class="diagnostic-theme-switch" role="group" aria-label="Tema de la carta">
            <button type="button" data-diagnostic-theme-option="light" aria-pressed="false">☀ Blanco</button>
            <button type="button" data-diagnostic-theme-option="dark" aria-pressed="true">☾ Nocturno</button>
          </div>
          <div id="saveStatus" class="status"></div>
        </div>
      </header>

      <section class="panel">
        <div class="client-form">
          <div class="field"><label>Buscar cliente</label><input id="clientSearch" type="search" placeholder="Escribí nombre o negocio" autocomplete="off"/><div id="clientSuggestions" class="client-suggestions"></div><input id="clientPicker" type="hidden"/></div>
          <div class="field"><label>CSM responsable</label><input id="csmName" placeholder="Nombre del CSM"/></div>
          <button id="newClient" class="btn" type="button">Crear diagnóstico</button>
        </div>
        <p class="muted" style="font-size:12px">El cliente se busca en CSM y en Leads; el diagnóstico queda vinculado a su GHL ID.</p>
        <div id="clientList" class="client-list"></div>
      </section>

      <section id="editor" hidden>
        <div class="panel">
          <div class="actions"><button class="btn alt" id="saveAll" type="button">Guardar todo</button><button class="btn alt" id="copyLink" type="button">Copiar link para cliente</button><button class="btn danger" id="deleteClient" type="button">Eliminar</button></div>
          <p class="small" style="margin:14px 0 6px">Link público de solo lectura</p><div id="publicLink" class="link-box"></div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Etapas del diagnóstico"></nav>
        <section id="stageContent"></section>
      </section>
    </main>
    <script src="/diagnostico/diagnostico-core.js?v=20260820-1"></script>
    <script src="/js/views/diagnostico.page.js?v=20260825-1"></script>
  </body>
</html>
