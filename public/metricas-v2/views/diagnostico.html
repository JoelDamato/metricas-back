<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico | Métricas</title><link rel="stylesheet" href="/css/styles.css"><style>
:root{--d-bg:#091224;--d-panel:#101d35;--d-line:#263d62;--d-text:#eef5ff;--d-muted:#a3b4d1;--d-blue:#4a8fff;--d-green:#31d6a0;--d-red:#fb7185;--d-amber:#f4bb4f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#173563 0,transparent 36rem),var(--d-bg);color:var(--d-text);font-family:Inter,Arial,sans-serif}.diag{max-width:1500px;margin:auto;padding:28px}.diag-top,.client-form,.actions,.tabs,.score-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.diag-top{justify-content:space-between;margin-bottom:20px}.back{color:#bcd5ff;text-decoration:none;font-weight:700;font-size:13px}h1{margin:8px 0 5px;font-size:36px}.muted{color:var(--d-muted);margin:0}.panel{background:rgba(16,29,53,.94);border:1px solid var(--d-line);border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 14px 44px #0003}.client-form{align-items:end}.field{display:grid;gap:6px;flex:1 1 185px}.field label,.small{font-size:11px;color:var(--d-muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}input,select,textarea{width:100%;padding:10px;border:1px solid var(--d-line);border-radius:9px;background:#0b172d;color:var(--d-text);font:14px inherit}textarea{min-height:70px;resize:vertical}.btn{border:0;border-radius:9px;background:var(--d-blue);color:white;padding:11px 15px;font-weight:800;cursor:pointer}.btn.alt{background:#1b3156}.btn.danger{background:#4e2030;color:#ffd2da}.btn:disabled{opacity:.5}.tabs{border-bottom:1px solid var(--d-line);padding-bottom:12px}.tab{background:#162746}.tab.active{background:var(--d-blue)}.stage{display:none}.stage.active{display:block}.area{border:1px solid var(--d-line);border-radius:12px;padding:15px;margin-top:12px}.area-head{display:flex;justify-content:space-between;gap:16px;align-items:start;flex-wrap:wrap}.area h3{margin:0 0 5px}.question{color:var(--d-muted);font-size:13px;margin:0}.score button{width:34px;height:34px;padding:0;margin-left:4px;background:#162746}.score button.active[data-score="1"],.score button.active[data-score="2"]{background:var(--d-red)}.score button.active[data-score="3"]{background:var(--d-amber);color:#332100}.score button.active[data-score="4"],.score button.active[data-score="5"]{background:var(--d-green);color:#052219}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:13px}.link-box{font:12px ui-monospace,monospace;word-break:break-all;color:#b8d4ff;background:#081225;border:1px dashed #456697;padding:10px;border-radius:8px}.list{display:grid;gap:7px;margin-top:12px}.client-row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0b172d;border:1px solid var(--d-line);border-radius:10px;padding:10px}.client-row button{background:transparent;color:var(--d-text);text-align:left;padding:0;border:0;cursor:pointer;flex:1}.status{font-size:13px;color:var(--d-muted)}.status.ok{color:var(--d-green)}.status.error{color:#ff9baa}@media(max-width:700px){.diag{padding:15px}h1{font-size:28px}.diag-top{align-items:start}.btn{width:100%}.score button{width:30px}}
</style></head><body><main class="diag"><header class="diag-top"><div><a class="back" href="/index.html">← Volver al panel CSM</a><h1>Diagnóstico</h1><p class="muted">Carta de rumbo del cliente: Inicial, Medio, Final y una vista segura para compartir.</p></div><div id="saveStatus" class="status"></div></header>
<section class="panel"><div class="client-form"><div class="field"><label>Buscar cliente</label><input id="clientSearch" type="search" placeholder="Escribí nombre o negocio"></div><div class="field"><label>Cliente de CSM</label><select id="clientPicker"><option value="">Cargando clientes...</option></select></div><div class="field"><label>CSM responsable</label><input id="csmName" placeholder="Nombre CSM"></div><button id="newClient" class="btn" type="button">Crear diagnóstico</button></div><p class="muted" style="font-size:13px">El cliente se toma directamente de la base CSM y el diagnóstico queda vinculado a su GHL ID.</p><div id="clientList" class="list"></div></section>
<section id="editor" hidden><div class="panel"><div class="actions"><button class="btn alt" id="saveAll" type="button">Guardar cambios</button><button class="btn alt" id="copyLink" type="button">Copiar link para cliente</button><button class="btn danger" id="deleteClient" type="button">Eliminar</button></div><p class="small" style="margin:15px 0 6px">Link de solo lectura para el cliente</p><div id="publicLink" class="link-box"></div></div><section class="panel"><div id="tabs" class="tabs"></div><div id="stageContent"></div></section></section>
</main><script src="/js/views/diagnostico.page.js?v=20260811-3"></script></body></html>
